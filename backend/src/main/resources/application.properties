# ===== AI StudyHub Backend Configuration =====

# Server
server.port=8080

# ===== DATABASE =====
# --- H2 (for local development, no MySQL needed) ---
spring.datasource.url=jdbc:h2:mem:studyhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- MySQL (uncomment for production) ---
# spring.datasource.url=jdbc:mysql://localhost:3306/studyhubdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# For MySQL: spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ===== JWT =====
app.jwt.secret=StudyHubSuperSecretKeyForJWTTokenGeneration2024!MustBe256BitsLong
app.jwt.expiration=86400000

# ===== AI APIs =====
# Get free key from: https://aistudio.google.com/
app.ai.gemini.api-key= Gemini API key goes here (get from Google AI Studio)
app.ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent

# Get free key from: https://console.groq.com/
app.ai.groq.api-key=YOUR_GROQ_API
app.ai.groq.url=https://api.groq.com/openai/v1/chat/completions
app.ai.groq.model=llama3-8b-8192

# OpenAI (paid)
app.ai.openai.api-key=YOUR_OPENAI_API_KEY

# ===== FILE UPLOAD =====
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
app.upload.dir=uploads/

# ===== CORS =====
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# ===== LOGGING =====
logging.level.com.studyhub=DEBUG
logging.level.org.springframework.security=WARN
